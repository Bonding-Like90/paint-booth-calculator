function lang() { return el.languageSelect.value; }
function units() { return el.unitSelect.value; }
function t(key) { return TEXT[lang()][key] ?? TEXT.en[key] ?? key; }

function showToast(message) {
  el.toast.textContent = message;
  el.toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    el.toast.classList.remove("show");
  }, 1800);
}

function formatNumber(value, decimals = 2) {
  return Number(value).toLocaleString(undefined, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function convertInputToFeet(value) {
  return units() === "imperial" ? value : value * 3.28084;
}

function getInputs() {
  return {
    companyName: el.companyName.value.trim(),
    purchaseOrder: el.purchaseOrder.value.trim(),
    widthInput: parseFloat(el.width.value) || 0,
    heightInput: parseFloat(el.height.value) || 0,
    lengthInput: parseFloat(el.length.value) || 0,
    deltaInput: el.deltaT.value === "" ? null : parseFloat(el.deltaT.value),
    ceilingLights: parseInt(el.ceilingLights.value, 10) || 0,
    sidewallLights: parseInt(el.sidewallLights.value, 10) || 0
  };
}

function determineWallSizeOrderGallons(gallonsNeeded) {
  // Based on your existing ordering model:
  // casesNeeded = ceil(gallonsNeeded / 4)
  // if gallonsNeeded <= 4 => casesNeeded = 1 => treat as "1 gallon" PN
  // else => "5 gallon" PN
  return gallonsNeeded <= APP.gallonsPerCase ? 1 : 5;
}

function getWallPartNumberAutoConfirm() {
  return localStorage.getItem(APP.wallPnConfirmKey) === "true";
}

function setWallPartNumberAutoConfirm(v) {
  localStorage.setItem(APP.wallPnConfirmKey, String(v));
}

function ensureWallPartNumberAutoConfirm() {
  const already = getWallPartNumberAutoConfirm();
  if (already) return true;

  // One-time confirm
  const ok = window.confirm(t("wallPnConfirmPrompt"));
  setWallPartNumberAutoConfirm(ok);
  return ok;
}

function calculate() {
  const input = getInputs();

  const widthFt = convertInputToFeet(input.widthInput);
  const heightFt = convertInputToFeet(input.heightInput);
  const lengthFt = convertInputToFeet(input.lengthInput);

  const wallAreaFt2 = 2 * (widthFt * heightFt) + 2 * (lengthFt * heightFt);
  const gallonsNeeded = wallAreaFt2 / APP.wallCoverageSqFtPerGallon;

  const casesNeeded = Math.ceil(gallonsNeeded / APP.gallonsPerCase);
  const weightLb = gallonsNeeded * APP.wallWeightLbPerGallon;

  const floorAreaFt2 = widthFt * lengthFt;
  const matsNeeded = Math.ceil(floorAreaFt2 / APP.floorMatCoverageSqFt);

  const totalLights = input.ceilingLights + input.sidewallLights;
  const glassAreaFt2 = totalLights * APP.glassSqFtPerLight;

  const clearViewGalMin = glassAreaFt2 / APP.clearViewCoverageHighSqFtPerGallon;
  const clearViewGalMax = glassAreaFt2 / APP.clearViewCoverageLowSqFtPerGallon;

  const clearViewQtMin = clearViewGalMin * 4;
  const clearViewQtMax = clearViewGalMax * 4;

  const clearViewPtMin = clearViewGalMin * 8;
  const clearViewPtMax = clearViewGalMax * 8;

  const clearViewOrderGallons = totalLights > 0 ? Math.max(1, Math.ceil(clearViewGalMax)) : 0;

  const volumeFt3 = widthFt * heightFt * lengthFt;

  let deltaF = null;
  if (input.deltaInput !== null && !isNaN(input.deltaInput)) {
    deltaF = units() === "imperial" ? input.deltaInput : input.deltaInput * 9 / 5;
  }
  const btu = deltaF !== null ? volumeFt3 * deltaF * 0.24 : null;

  // NEW: Part numbers
  const wallSize = determineWallSizeOrderGallons(gallonsNeeded);
  const wallPartNumber = wallSize === 1 ? APP.wallPn1Gal : APP.wallPn5Gal;

  const floorMatPartNumber = APP.floorMatPn;
  const clearViewPartNumber = APP.clearViewPn;

  return {
    input,
    wallAreaFt2,
    gallonsNeeded,
    casesNeeded,
    weightLb,
    floorAreaFt2,
    matsNeeded,
    totalLights,
    glassAreaFt2,
    clearViewGalMin,
    clearViewGalMax,
    clearViewQtMin,
    clearViewQtMax,
    clearViewPtMin,
    clearViewPtMax,
    clearViewOrderGallons,
    volumeFt3,
    btu,

    // NEW
    wallSize,
    wallPartNumber,
    floorMatPartNumber,
    clearViewPartNumber
  };
}

function renderResults() {
  const r = calculate();

  if (units() === "imperial") {
    el.wallAreaResult.textContent = `${formatNumber(r.wallAreaFt2, 0)} ft²`;
    el.productNeededResult.textContent = `${formatNumber(r.gallonsNeeded, 2)} gal`;
    el.weightResult.textContent = `${formatNumber(r.weightLb, 1)} lb`;
    el.floorAreaResult.textContent = `${formatNumber(r.floorAreaFt2, 0)} ft²`;
    el.glassAreaResult.textContent = `${formatNumber(r.glassAreaFt2, 0)} ft²`;
    el.clearViewNeededResult.textContent =
      `${formatNumber(r.clearViewGalMin, 2)} - ${formatNumber(r.clearViewGalMax, 2)} gal`;
    el.volumeResult.textContent = `${formatNumber(r.volumeFt3, 0)} ft³`;
  } else {
    el.wallAreaResult.textContent = `${formatNumber(r.wallAreaFt2 * APP.sqFtToSqM, 2)} m²`;
    el.productNeededResult.textContent = `${formatNumber(r.gallonsNeeded * APP.gallonToLiter, 2)} L`;
    el.weightResult.textContent = `${formatNumber(r.weightLb * APP.lbToKg, 2)} kg`;
    el.floorAreaResult.textContent = `${formatNumber(r.floorAreaFt2 * APP.sqFtToSqM, 2)} m²`;
    el.glassAreaResult.textContent = `${formatNumber(r.glassAreaFt2 * APP.sqFtToSqM, 2)} m²`;
    el.clearViewNeededResult.textContent =
      `${formatNumber(r.clearViewGalMin * APP.gallonToLiter, 2)} - ${formatNumber(r.clearViewGalMax * APP.gallonToLiter, 2)} L`;
    el.volumeResult.textContent = `${formatNumber(r.volumeFt3 * APP.cuFtToCuM, 2)} m³`;
  }

  el.casesResult.textContent = `${formatNumber(r.casesNeeded, 0)}`;
  el.matsResult.textContent = `${formatNumber(r.matsNeeded, 0)}`;
  el.totalLightsResult.textContent = `${formatNumber(r.totalLights, 0)}`;

  el.clearViewQuartsResult.textContent =
    `${formatNumber(r.clearViewQtMin, 2)} - ${formatNumber(r.clearViewQtMax, 2)} qt`;
  el.clearViewPintsResult.textContent =
    `${formatNumber(r.clearViewPtMin, 2)} - ${formatNumber(r.clearViewPtMax, 2)} pt`;

  el.clearViewOrderResult.textContent = r.clearViewOrderGallons > 0
    ? `${formatNumber(r.clearViewOrderGallons, 0)} gal`
    : `0 gal`;

  el.btuResult.textContent = r.btu !== null ? `${formatNumber(r.btu, 0)} BTU/hr` : "-";

  // NEW: Part numbers display
  // Wall PN is conditional on one-time user confirmation.
  const canAuto = ensureWallPartNumberAutoConfirm();
  el.wallPartNumberResult.textContent = canAuto ? r.wallPartNumber : "(Confirm rule)";
  el.floorPartNumberResult.textContent = r.floorMatPartNumber;
  el.clearViewPartNumberResult.textContent = r.clearViewPartNumber;
}

function loadPresets() {
  const raw = localStorage.getItem(APP.presetKey);
  try {
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function savePresetsToStorage(presets) {
  localStorage.setItem(APP.presetKey, JSON.stringify(presets));
}

function populatePresetDropdown() {
  const presets = loadPresets();
  const currentValue = el.presetSelect.value;
  el.presetSelect.innerHTML = "";

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = t("presetDefaultOption");
  el.presetSelect.appendChild(defaultOption);

  presets.forEach((preset, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = preset.name;
    el.presetSelect.appendChild(option);
  });

  if (currentValue !== "") el.presetSelect.value = currentValue;
}

function savePreset() {
  const presets = loadPresets();
  const input = getInputs();

  const preset = {
    name: el.presetName.value.trim() || `Preset ${presets.length + 1}`,
    language: lang(),
    unitSystem: units(),
    width: input.widthInput,
    height: input.heightInput,
    length: input.lengthInput,
    deltaT: input.deltaInput ?? "",
    ceilingLights: input.ceilingLights,
    sidewallLights: input.sidewallLights
  };

  presets.push(preset);
  savePresetsToStorage(presets);

  el.presetName.value = "";
  showToast(t("presetSaved"));
  populatePresetDropdown();
}

function loadSelectedPreset() {
  const selectedIndex = el.presetSelect.value;
  if (selectedIndex === "") return;

  const presets = loadPresets();
  const preset = presets[Number(selectedIndex)];
  if (!preset) return;

  el.languageSelect.value = preset.language || "en";
  el.unitSelect.value = preset.unitSystem || "imperial";
  el.companyName.value = "";
  el.purchaseOrder.value = "";
  el.width.value = preset.width;
  el.height.value = preset.height;
  el.length.value = preset.length;
  el.deltaT.value = preset.deltaT;
  el.ceilingLights.value = preset.ceilingLights ?? 0;
  el.sidewallLights.value = preset.sidewallLights ?? 0;

  updateLabels();
  renderResults();
  showToast(t("presetLoaded"));
}

function deletePreset() {
  const selectedIndex = el.presetSelect.value;
  if (selectedIndex === "") {
    showToast(t("selectPreset"));
    return;
  }

  const presets = loadPresets();
  presets.splice(Number(selectedIndex), 1);
  savePresetsToStorage(presets);

  populatePresetDropdown();
  showToast(t("presetDeleted"));
}

function resetForm() {
  el.languageSelect.value = "en";
  el.unitSelect.value = "imperial";
  el.companyName.value = "";
  el.purchaseOrder.value = "";
  el.width.value = "14";
  el.height.value = "9";
  el.length.value = "27";
  el.deltaT.value = "";
  el.ceilingLights.value = "8";
  el.sidewallLights.value = "6";
  el.presetName.value = "";

  updateLabels();
  renderResults();
  showToast(t("resetDone"));
}
